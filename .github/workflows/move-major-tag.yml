name: Move the v1 major tag

# Keeps `v1` pointing at the latest stable v1.x.y release. Callers that use
# `@v1` then receive minor and patch releases without changing their workflow.
# Release tags (v1.x.y) stay immutable for audit and rollback; `v1` is the only
# mutable ref and should be protected by a tag ruleset.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable v1.x.y release tag to point v1 at"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: move-major-tag
  cancel-in-progress: false

jobs:
  move:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v1.')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v1.'))
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag-push token
        env:
          TAG_TOKEN: ${{ secrets.MAIRA_LENS_TAG_TOKEN }}
        run: |
          if [ -z "$TAG_TOKEN" ]; then
            echo "::error::Set MAIRA_LENS_TAG_TOKEN to a token owned by an organization admin; the v1 tag ruleset blocks GITHUB_TOKEN."
            exit 1
          fi

      - name: Check out the release
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.MAIRA_LENS_TAG_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Point v1 at this release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v1\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a stable v1.x.y release tag."
            exit 1
          fi
          git tag -f v1 "$TAG"
          git push origin refs/tags/v1 --force
          echo "Moved v1 to $TAG."
